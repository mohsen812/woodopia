<!DOCTYPE html>
<html>
<head>
<title>FEEMAAS Visual Engine Test</title>

<style>
body{
    font-family: Arial;
}

#canvas{
    width:800px;
    height:600px;
    border:2px solid #333;
    position:relative;
    background:#fafafa;
}

.triangle{
    width:0;
    height:0;
    border-left:60px solid transparent;
    border-right:60px solid transparent;
    border-bottom:120px solid #8B4513;
    position:absolute;
}
</style>

</head>

<body>

<h1>FEEMAAS Visual Engine Test</h1>

<div id="canvas"></div>


<script>

fetch("http://127.0.0.1:8000/api/projects/visuals/")
.then(response=>response.json())
.then(data=>{

    console.log(data);


    data.forEach(item=>{

        if(item.shape_type==="triangle"){

            let triangle=document.createElement("div");

            triangle.className="triangle";


            triangle.style.left =
            item.position_x + 200 + "px";


            triangle.style.top =
            item.position_y + 200 + "px";


            triangle.style.transform =
            "rotate("+item.rotation+"deg)";


            document
            .getElementById("canvas")
            .appendChild(triangle);

        }

    });


})
.catch(err=>console.log(err));


</script>


</body>
</html>
