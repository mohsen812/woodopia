<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ورود | FEEMAAS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Tahoma, Arial, sans-serif;
            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(139, 92, 246, 0.12),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(34, 211, 238, 0.12),
                    transparent 35%
                ),
                #f8fafc;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-wrapper {
            width: 100%;
            max-width: 430px;
            padding: 24px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid #e5e7eb;
            border-radius: 28px;
            padding: 38px;
            box-shadow:
                0 25px 70px rgba(15, 23, 42, 0.10);
        }

        .logo {
            width: 58px;
            height: 58px;
            border-radius: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 22px;

            font-size: 28px;
            font-weight: 900;
            color: white;

            background:
                linear-gradient(
                    135deg,
                    #8b5cf6,
                    #06b6d4
                );

            box-shadow:
                0 12px 30px rgba(139, 92, 246, 0.25);
        }

        h1 {
            text-align: center;
            margin: 0;
            color: #111827;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin: 10px 0 30px;
            line-height: 1.8;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-size: 14px;
            font-weight: 700;
        }

        .form-control {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #dbe2ea;
            border-radius: 14px;
            outline: none;
            font-size: 15px;
            transition: 0.2s;
            background: #fff;
        }

        .form-control:focus {
            border-color: #8b5cf6;
            box-shadow:
                0 0 0 4px rgba(139, 92, 246, 0.10);
        }

        .error {
            color: #dc2626;
            background: #fef2f2;
            border: 1px solid #fecaca;
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .login-button {
            width: 100%;
            border: 0;
            border-radius: 14px;
            padding: 15px;

            background:
                linear-gradient(
                    135deg,
                    #8b5cf6,
                    #06b6d4
                );

            color: white;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;

            box-shadow:
                0 12px 25px rgba(139, 92, 246, 0.20);
        }

        .login-button:hover {
            transform: translateY(-1px);
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
        }

        .back-home:hover {
            color: #8b5cf6;
        }
    </style>
</head>

<body>

<div class="login-wrapper">

    <div class="login-card">

        <div class="logo">
            F
        </div>

        <h1>
            ورود به FEEMAAS
        </h1>

        <div class="subtitle">
            وارد فضای کاری خود شوید
        </div>

        {% if form.non_field_errors %}
            <div class="error">
                {{ form.non_field_errors }}
            </div>
        {% endif %}

        <form method="post">

            {% csrf_token %}

            <div class="field">
                {{ form.username.label_tag }}
                {{ form.username }}
            </div>

            <div class="field">
                {{ form.password.label_tag }}
                {{ form.password }}
            </div>

            <input
                type="hidden"
                name="next"
                value="{{ next|default:'/workspace/' }}"
            >

            <button
                type="submit"
                class="login-button"
            >
                ورود به Workspace
            </button>

        </form>

        <a
            href="/"
            class="back-home"
        >
            بازگشت به صفحه اصلی
        </a>

    </div>

</div>

</body>
</html>
