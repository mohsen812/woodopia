<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بازیابی رمز | FEEMAAS</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 20%,#31205c,transparent 40%),#080b19;color:#f5f7ff;font-family:Tahoma,Arial,sans-serif}.card{width:min(460px,100%);padding:34px;border:1px solid #39405d;border-radius:24px;background:rgba(18,24,48,.88);box-shadow:0 25px 80px #0006}h1{font-size:24px}p{color:#a7b0ce;line-height:2;font-size:14px}label{display:block;margin:18px 0 8px}input{width:100%;padding:13px;border:1px solid #49516e;border-radius:12px;background:#090e22;color:white}button{width:100%;padding:14px;margin-top:18px;border:0;border-radius:12px;background:linear-gradient(100deg,#c4b5fd,#67e8f9);font-weight:bold;cursor:pointer}a{display:block;text-align:center;margin-top:20px;color:#67e8f9;text-decoration:none;font-size:13px}.error{color:#fca5a5;font-size:13px}
</style></head><body><main class="card"><h1>بازیابی رمز عبور</h1><p>ایمیل حساب خود را وارد کنید. اگر حساب واجد شرایطی وجود داشته باشد، دستورالعمل بازیابی ارسال خواهد شد.</p><form method="post">{% csrf_token %}{{ form.email.label_tag }}{{ form.email }}{% for error in form.email.errors %}<div class="error">{{ error }}</div>{% endfor %}<button type="submit">ارسال دستورالعمل بازیابی</button></form><a href="{% url 'login' %}">بازگشت به ورود</a></main></body></html>
