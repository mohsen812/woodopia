<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل عملیات | FEEMAAS</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 32px;
            font-family: Tahoma, Arial, sans-serif;
            color: #e5e7eb;
            background:
                radial-gradient(circle at 15% 15%, rgba(124, 58, 237, .22), transparent 35%),
                radial-gradient(circle at 85% 80%, rgba(6, 182, 212, .16), transparent 35%),
                #0b1020;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header,
        .panel {
            border: 1px solid rgba(148, 163, 184, .18);
            background: rgba(15, 23, 42, .76);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .16);
        }

        .header {
            margin-bottom: 24px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px;
        }

        p {
            color: #94a3b8;
            line-height: 1.9;
        }

        .status {
            display: inline-block;
            margin-top: 12px;
            padding: 8px 12px;
            border-radius: 10px;
            color: #a7f3d0;
            background: rgba(16, 185, 129, .12);
            border: 1px solid rgba(16, 185, 129, .25);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <main class="container">
        <section class="header">
            <h1>پنل عملیات FEEMAAS</h1>
            <p>مرکز مدیریت و پیگیری درخواست‌های عملیاتی سامانه.</p>
            <span class="status">صفحهٔ اولیه · دسترسی محدود</span>
        </section>

        <section class="panel">
            <h2>مرکز درخواست‌ها</h2>
            <p>
                این بخش فعلاً پوستهٔ اولیه است.
                پس از تکمیل کنترل دسترسی و آزمون ورود،
                درخواست‌های کارگاه، طراحی، مشاوره، کنترل کیفیت و پشتیبانی
                به‌صورت مرحله‌ای به آن متصل می‌شوند.
            </p>
        </section>
    </main>
</body>
</html>
