<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<title>
FEEMAAS Workspace
</title>

<link rel="stylesheet" href="workspace.css">

</head>


<body>


<header class="topbar">

<div class="logo">
FEEMAAS
</div>

<div>
Workspace
</div>

</header>



<section class="capacity-bar">


<h3>
پروژه‌های قابل ایجاد
</h3>


<div class="capacity-items">

<div class="capacity-triangle active"
data-slot="1"></div>

<div class="capacity-triangle"
data-slot="2"></div>

<div class="capacity-triangle"
data-slot="3"></div>

<div class="capacity-triangle"
data-slot="4"></div>

<div class="capacity-triangle"
data-slot="5"></div>


</div>


</section>




<main class="workspace">


<div class="canvas-area">


<svg
id="visualCanvas"
viewBox="0 0 800 500">

</svg>


</div>


</main>




<div id="projectModal" class="modal hidden">


<div class="modal-box">


<h2>
ثبت پروژه جدید
</h2>


<input id="projectTitleInput"
placeholder="عنوان سفارش">


<textarea id="projectDescriptionInput"
placeholder="توضیحات"></textarea>


<input id="projectQuantityInput"
placeholder="تعداد">


<input id="projectBudgetInput"
placeholder="بودجه تقریبی">


<button id="createProjectBtn">
ارسال به مشاور
</button>


<button id="closeModal">
انصراف
</button>


</div>


</div>




<script src="workspace.js"></script>


</body>

</html>
